server:
  port: 8888
spring:
  application:
    name: rest-springboot-java-e2025
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
    show-sql: false
    # add essa config. abaixo para não aparecer o warning (HHH000489: No JTA platform available) ao rodar.
    open-in-view: false

  spring-doc:
    paths-to-match: /api/**/v1/**
    swagger-ui:
      use-root-path: true
